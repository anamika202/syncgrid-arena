<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncGrid Multiplayer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    .status { margin: 12px 0; font-weight: 500; font-size: 0.95rem; color: #cbd5e1; }
    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input, button { padding: 10px 14px; border-radius: 8px; border: none; font-size: 0.95rem; }
    input { background: #334155; color: white; outline: none; }
    button { background: #0284c7; color: white; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px auto; max-width: 280px; }
    .cell { aspect-ratio: 1; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 700; cursor: pointer; user-select: none; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #047857; color: #a7f3d0; font-size: 0.8rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SyncGrid Multiplayer</h1>
    <div id="status" class="status">Connecting to network...</div>
    
    <div class="controls" id="connection-controls">
      <div id="my-id-container" style="display:none;">
        <span style="font-size:0.85rem; color:#94a3b8;">Your Room ID:</span>
        <div id="my-id" style="font-weight:700; color:#38bdf8; font-size:1.1rem; margin-bottom: 8px;"></div>
      </div>
      <input type="text" id="peer-id-input" placeholder="Enter Friend's Room ID" />
      <button onclick="connectToPeer()">Join Friend's Room</button>
    </div>

    <div class="grid" id="grid">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button onclick="resetGame()" style="margin-top: 10px; width: 100%;">Restart Round</button>
  </div>

  <script>
    let peer, conn;
    let board = Array(9).fill(null);
    let mySymbol = 'X';
    let currentTurn = 'X';
    let isHost = false;

    peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('my-id-container').style.display = 'block';
      document.getElementById('my-id').innerText = id;
      document.getElementById('status').innerText = 'Ready. Share your Room ID or join one!';
    });

    peer.on('connection', (c) => {
      conn = c;
      isHost = true;
      mySymbol = 'X';
      setupConnection();
      document.getElementById('status').innerText = 'Player connected! You are X (Your turn)';
    });

    function connectToPeer() {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert('Please enter Room ID');
      conn = peer.connect(peerId);
      isHost = false;
      mySymbol = 'O';
      setupConnection();
      document.getElementById('status').innerText = 'Connected! You are O (Opponent turn)';
    }

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'move') {
          board[data.index] = data.symbol;
          currentTurn = mySymbol;
          renderBoard();
          checkWinner();
        } else if (data.type === 'reset') {
          board = Array(9).fill(null);
          currentTurn = 'X';
          renderBoard();
          document.getElementById('status').innerText = 'Game reset!';
        }
      });
    }

    function makeMove(index) {
      if (!conn) return alert('Connect with a second player first!');
      if (board[index] || currentTurn !== mySymbol) return;

      board[index] = mySymbol;
      currentTurn = mySymbol === 'X' ? 'O' : 'X';
      renderBoard();
      conn.send({ type: 'move', index, symbol: mySymbol });
      checkWinner();
    }

    function renderBoard() {
      const cells = document.getElementsByClassName('cell');
      for (let i = 0; i < 9; i++) {
        cells[i].innerText = board[i] || '';
        cells[i].className = 'cell ' + (board[i] ? board[i].toLowerCase() : '');
      }
      if (!checkWinner()) {
        document.getElementById('status').innerText = currentTurn === mySymbol ? "Your turn!" : "Opponent's turn...";
      }
    }

    function checkWinner() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (let w of wins) {
        if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[1]] === board[w[2]]) {
          const winner = board[w[0]];
          document.getElementById('status').innerText = winner === mySymbol ? "🏆 You Won!" : "Opponent Won!";
          return true;
        }
      }
      if (board.every(cell => cell !== null)) {
        document.getElementById('status').innerText = "Game Draw!";
        return true;
      }
      return false;
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentTurn = 'X';
      renderBoard();
      if (conn) conn.send({ type: 'reset' });
      document.getElementById('status').innerText = 'Game reset!';
    }
  </script>
</body>
</html>
